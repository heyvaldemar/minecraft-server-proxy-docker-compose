name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned mc-proxy image from the compose file
        id: pin
        run: |
          image="$(grep -oE '\$\{MINECRAFT_SERVER_IMAGE_TAG:-[^}]+\}' minecraft-server-proxy-docker-compose.yml | head -1 | sed -E 's/^\$\{MINECRAFT_SERVER_IMAGE_TAG:-//; s/\}$//')"
          if [ -z "$image" ]; then
            echo "MINECRAFT_SERVER_IMAGE_TAG default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of mc-proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-mc-proxy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-mc-proxy.sarif
          category: trivy-mc-proxy

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned digest against what the tag resolves to now
        run: |
          pin="$(grep -oE '\$\{MINECRAFT_SERVER_IMAGE_TAG:-[^}]+\}' minecraft-server-proxy-docker-compose.yml | head -1 | sed -E 's/^\$\{MINECRAFT_SERVER_IMAGE_TAG:-//; s/\}$//')"
          ref="${pin%%@*}"
          pinned_digest="${pin##*@}"
          current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$pinned_digest" != "$current_digest" ]; then
            echo "::error::digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
            exit 1
          fi
          echo "MINECRAFT_SERVER_IMAGE_TAG OK (${ref})"

      - name: Compare the pinned version against the latest itzg/docker-mc-proxy release
        run: |
          pin="$(grep -oE '\$\{MINECRAFT_SERVER_IMAGE_TAG:-[^}]+\}' minecraft-server-proxy-docker-compose.yml | head -1 | sed -E 's/^\$\{MINECRAFT_SERVER_IMAGE_TAG:-//; s/\}$//')"
          ref="${pin%%@*}"
          pinned_version="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/itzg/docker-mc-proxy/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest itzg/docker-mc-proxy release"
            exit 1
          fi
          if [ "$pinned_version" != "$latest" ]; then
            echo "::error::mc-proxy pin is behind: pinned ${pinned_version}, latest release is ${latest}"
            exit 1
          fi
          echo "mc-proxy pin ${pinned_version} matches the latest release"

  deploy-and-test:
    name: docker compose up + Velocity port smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      DOCKER_COMPOSE_FILE: minecraft-server-proxy-docker-compose.yml
      COMPOSE_PROJECT_NAME: minecraft-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate test .env
        # No secrets in this stack; the compose x-images defaults apply, so
        # CI tests exactly the pins the template ships.
        run: |
          touch .env
          echo "Using compose defaults for the CI run"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Print Docker Compose services status
        run: docker ps

      - name: Wait for Velocity to listen and load plugins
        # The proxy downloads Geyser and Floodgate on first start; "Done"
        # in the log plus an open 25565 proves the shipped configuration
        # boots with its plugin set.
        run: |
          # shellcheck disable=SC2016
          timeout 8m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs | grep -qE "Done \(|Listening on"; do
            echo "Waiting for Velocity to finish starting..."
            sleep 10
          done'
          timeout 1m bash -c 'until timeout 5 bash -c ":> /dev/tcp/127.0.0.1/25565"; do sleep 2; done'
          echo "Velocity is listening on 25565"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs | grep -E "Geyser|Floodgate" | head -5 || true

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
